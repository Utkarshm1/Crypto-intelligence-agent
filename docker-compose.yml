version: "3.9"

services:
  mcp_server:
    build: .
    command: uvicorn mcp_server.main:app --host 0.0.0.0 --port 8001
    env_file:
      - .env
    ports:
      - "8001:8001"

  agent_backend:
    build: .
    command: uvicorn agent_backend.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      MCP_BASE_URL: http://mcp_server:8001
      LLM_BASE_URL: http://host.docker.internal:11434/v1
    ports:
      - "8000:8000"
    depends_on:
      - mcp_server

  frontend:
    build: .
    command: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501
    env_file:
      - .env
    environment:
      AGENT_BACKEND_URL: http://agent_backend:8000
      MCP_BASE_URL: http://mcp_server:8001
    ports:
      - "8501:8501"
    depends_on:
      - agent_backend
